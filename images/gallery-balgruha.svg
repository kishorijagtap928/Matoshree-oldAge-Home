<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EB"/>
      <stop offset="100%" stop-color="#F2E6CD"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgBal)"/>
  <!-- Two supportive hands motif / Heart symbol for Balgruha Sahakarya -->
  <circle cx="300" cy="230" r="110" fill="#E8F1EC"/>
  <!-- Heart -->
  <path d="M300,260 C260,200 220,160 260,130 C290,110 300,140 300,150 C300,140 310,110 340,130 C380,160 340,200 300,260 Z" fill="#C28B1E"/>
  <!-- Gentle Supporting hands -->
  <path d="M210,310 Q300,370 390,310" stroke="#1B4332" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Label -->
  <rect x="40" y="30" width="240" height="40" fill="#1B4332" rx="20"/>
  <text x="160" y="56" font-family="'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">बालगृहासाठी सहकार्य उपक्रम</text>
</svg>
